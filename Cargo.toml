[package]
name = "gband"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serialize", "async", "send"] }
notify = "8.2.0"
notify-rust = "4.18.1"
portable-pty = "0.9.0"
postcard = { version = "1.1.3", features = ["use-std"] }
ratatui = "0.30.2"
rustix = { version = "1.1.5", features = ["process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
tui-term = "0.3.4"
vt100 = "0.16.2"
