[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license-file = "LICENSE"

[workspace.dependencies]
gband-core = { path = "crates/core" }
gband-protocol = { path = "crates/protocol" }
gband-server = { path = "crates/server" }
gband-client = { path = "crates/client" }
gband-emulator = { path = "crates/emulator" }
gband-test-support = { path = "crates/test-support" }
gband-harness = { path = "crates/harness" }
gband-lua = { path = "crates/lua" }
gband-scratch = { path = "crates/scratch" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29.0"
directories = "6.0.0"
insta = "1"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serialize", "async", "send"] }
notify-rust = "4.18.1"
portable-pty = "0.9.0"
postcard = { version = "1.1.3", features = ["use-std"] }
ratatui = "0.30.2"
rustix = { version = "1.1.5", features = ["fs", "net", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = "1.53.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-term = "0.3.4"
unicode-width = "0.2.2"
vt100 = "0.16.2"

[package]
name = "gband"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
gband-core.workspace = true
gband-lua.workspace = true
gband-protocol.workspace = true
gband-server.workspace = true
gband-client.workspace = true
gband-harness.workspace = true
clap.workspace = true
clap_complete.workspace = true
rustix.workspace = true
tokio = { workspace = true, features = ["full"] }
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[dev-dependencies]
gband-emulator.workspace = true
gband-scratch.workspace = true
gband-test-support.workspace = true
portable-pty.workspace = true
ratatui.workspace = true
