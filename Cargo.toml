[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
gband-core = { path = "crates/core" }
gband-protocol = { path = "crates/protocol" }
gband-server = { path = "crates/server" }
gband-client = { path = "crates/client" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serialize", "async", "send"] }
notify = "8.2.0"
notify-rust = "4.18.1"
portable-pty = "0.9.0"
postcard = { version = "1.1.3", features = ["use-std"] }
ratatui = "0.30.2"
rustix = { version = "1.1.5", features = ["fs", "net", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-term = "0.3.4"
vt100 = "0.16.2"

[package]
name = "gband"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
gband-protocol.workspace = true
gband-server.workspace = true
gband-client.workspace = true
clap.workspace = true
rustix.workspace = true
tokio.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true

[dev-dependencies]
portable-pty.workspace = true
vt100.workspace = true
